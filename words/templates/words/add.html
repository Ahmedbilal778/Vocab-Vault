{% extends 'words/base.html' %}{% block content %}
<h3 class="mb-3">Add New Word</h3>
<div class="card p-3 mb-3"><div class="d-flex gap-2 flex-wrap"><button type="button" class="btn btn-vv" id="gen"><i class="bi bi-stars"></i> Generate with AI</button>
<button type="button" class="btn btn-outline-success" id="easy">Make it easier</button><span id="msg" class="align-self-center text-muted small">Type a word below, then click Generate.</span></div>
<div id="extra" class="mt-3 small" style="display:none"></div></div>
<div class="card p-4"><form method="post">{% csrf_token %}<div class="row g-3">
{% for f in form %}<div class="col-md-6"><label class="form-label">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
</div><button class="btn btn-vv mt-3">Save word</button></form></div>{% endblock %}
{% block js %}<script>
async function ai(easier){
 const w=document.getElementById('id_word').value.trim(), m=document.getElementById('msg');
 if(!w){m.textContent='Enter a word first.';return}
 m.textContent='Thinking...';
 const fd=new FormData();fd.append('word',w);if(easier)fd.append('easier','1');
 const r=await fetch("{% url 'ai_word' %}",{method:'POST',headers:{'X-CSRFToken':'{{ csrf_token }}'},body:fd});
 const d=await r.json(); if(d.error){m.textContent=d.error;return}
 for(const k of ['meaning','hindi_meaning','example','synonyms','antonyms','part_of_speech','pronunciation']){
  const el=document.getElementById('id_'+k); if(el&&d[k]) el.value=Array.isArray(d[k])?d[k].join(', '):d[k];}
 const df=document.getElementById('id_difficulty'); if(df&&['easy','medium','hard'].includes(d.difficulty)) df.value=d.difficulty;
 const x=document.getElementById('extra'); x.style.display='block';
 x.innerHTML='<b>Common usage:</b> '+(d.common_usage||'')+'<br><b>Conversation:</b> '+(d.conversation_example||'');
 m.textContent='Filled. Review and save.';
}
gen.onclick=()=>ai(false);easy.onclick=()=>ai(true);
</script>{% endblock %}
